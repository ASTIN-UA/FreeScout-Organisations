name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIP
        run: |
          cd Modules
          zip -r ../OrgPortal.zip OrgPortal/

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: OrgPortal.zip
          # Without an explicit body, action-gh-release falls back to the raw
          # message of the commit the tag points to — including internal
          # trailers (Co-Authored-By, session links) — and publishes it as
          # the public release description. Point release notes at the
          # changelog instead.
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

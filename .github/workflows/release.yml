name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build module ZIP
        run: |
          cd Modules
          zip -r ../OrgPortal.zip OrgPortal/

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: OrgPortal.zip
